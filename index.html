    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Soni Labs",
      "description": "Premium design, AI-powered development, and lead generation automation from one specialized studio.",
      "url": "https://sonilabs.studio",
      "email": "hello@sonilabs.studio",
      "priceRange": "$1,500 - $7,000",
      "areaServed": "Worldwide",
      "serviceType": ["Web Design", "Web Development", "Lead Generation Automation", "UI/UX Design"],
      "knowsAbout": ["React", "Next.js", "Tailwind CSS", "Figma", "AI Development", "n8n Automation"],
      "sameAs": [
        "https://twitter.com/sonilabs",
        "https://linkedin.com/company/sonilabs"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "AI-Powered Website Design & Build",
          "description": "End-to-end creation of premium, conversion-optimized websites utilizing modern AI development workflows.",
          "priceSpecification": {
            "@type": "PriceSpecification",
            "minPrice": "3000",
            "maxPrice": "7000",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "Offer",
          "name": "Lead Gen Automation",
          "description": "Automated systems that turn traffic into qualified leads.",
          "priceSpecification": {
            "@type": "PriceSpecification",
            "minPrice": "1500",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "Offer",
          "name": "Embedded Design Partner",
          "description": "Ongoing design and development support on a monthly retainer.",
          "priceSpecification": {
            "@type": "PriceSpecification",
            "minPrice": "2000",
            "priceCurrency": "USD",
            "billingDuration": "P1M"
          }
        }
      ]
    }
    </script>

    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do payments work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "50% upfront before work begins, 50% on delivery. We accept international transfers via Wise or direct bank transfer."
          }
        },
        {
          "@type": "Question",
          "name": "What's the typical timeline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most projects go from first call to live site in 2–4 weeks depending on scope."
          }
        },
        {
          "@type": "Question",
          "name": "Do you work with international clients?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, most clients are based in the US, Australia, UK, and Europe. We work fully remote and async-friendly."
          }
        },
        {
          "@type": "Question",
          "name": "What if I need changes after launch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every project includes one round of revisions. Additional changes can be scoped separately or covered under a retainer."
          }
        },
        {
          "@type": "Question",
          "name": "What tech stack do you use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Figma, No-code tools (Framer and Wix Studio), Next.js, React, Tailwind CSS, Claude Code, Cursor for AI-assisted development, and n8n for automations."
          }
        },
        {
          "@type": "Question",
          "name": "Can you help with ongoing design work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, the Embedded Design Partner retainer is built for exactly that."
          }
        }
      ]
